name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: products_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d products_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

env:
  DB_HOST: localhost
  DB_PORT: 5432
  DB_NAME: products_test_db
  DB_USER: postgres
  DB_PASSWORD: postgres
  JWT_SECRET: 4a2b9f3e8c7d6a5b1e0f9382716a5b4c3d2e1f0a9b8c7d6e5f4a3b2c1d0e9f8a

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest

